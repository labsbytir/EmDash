contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-base
    - ca-certificates-bundle
    - gtk-3
    - hicolor-icon-theme
    - python3.13
    - emdash

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: nonroot

entrypoint:
  command: /usr/bin/emdash

annotations:
  org.opencontainers.image.title: "EmDash"
  org.opencontainers.image.description: "EmDash Qt editor on Newsk OS flavor by tir labs inc."
  org.opencontainers.image.vendor: "tir labs inc."
  org.opencontainers.image.url: "https://github.com/labsbytir/EmDash"