package:
  name: emdash
  version: 1.6.5
  epoch: 0
  description: "EmDash - lightweight Qt text editor (FeatherPad fork), Newsk flavor"
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - cmake
      - qt6-qtbase-dev
      - hunspell-dev
      - python3.13
      - wget

# NOTE: full build blocked on Wolfi providing qt6-qtsvg (hard requirement:
# svgicons.cpp). Rest of the pipeline is ready pending that package.
subpackages:
  - name: emdash-harper
    description: "Harper grammar-check LS for EmDash (musl static)"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          cd /tmp
          wget -q https://github.com/automattic/harper/releases/download/v3.3.0/harper-ls-${{build.arch}}-unknown-linux-musl.tar.gz -O harper-ls.tar.gz
          tar -xzf harper-ls.tar.gz
          install -m 0755 harper-ls ${{targets.contextdir}}/usr/bin/harper-ls

pipeline:
  - uses: cmake/configure
    with:
      opts: -DWITHOUT_X11=ON
  - uses: cmake/build
  - uses: cmake/install

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      install -m 0755 /home/build/tools/emdash-harper.sh ${{targets.contextdir}}/usr/bin/emdash-harper
      install -m 0755 /home/build/tools/emdash-wp.py ${{targets.contextdir}}/usr/bin/emdash-wp

  - uses: strip